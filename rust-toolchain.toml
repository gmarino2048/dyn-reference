# Used by rustup users. The Nix dev shell (flake.nix) reads this same file,
# so both paths get the same toolchain, components, and targets.
[toolchain]
channel = "stable"
components = [
  "cargo",
  "clippy",
  "rust-analyzer",
  "rust-docs",
  "rust-src",
  "rust-std",
  "rustc",
  "rustfmt",
]
targets = ["aarch64-apple-darwin"]
profile = "default"
